name: live

# Checks the PUBLISHED site: the hub matches this commit (i.e. Pages actually
# deployed), and every resource card opens (HTTP 200, has a title, links back
# to the hub). Weekly run catches a resource repo that broke or went private.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 11 * * 1"   # Mondays ~7 AM Eastern
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check live hub + resources
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python3 scripts/live_check.py --expect-current
          else
            python3 scripts/live_check.py
          fi
